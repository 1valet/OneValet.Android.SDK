plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    // Sample's networking layer (Codable-style models).
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.onevalet.onevaletsdk.demo'
    compileSdk compile_sdk_version

    defaultConfig {
        applicationId "com.onevalet.onevaletsdk.demo"
        minSdk min_sdk_version
        targetSdk target_sdk_version
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Required: OneValetSDK enables core library desugaring, so consumers must too.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        // BuildConfig.DEBUG gates the network layer's body logging.
        buildConfig true
    }
}

dependencies {
    // HOW AN INTEGRATOR ADDS THE SDK — one coordinate, resolved from the 1VALET
    // Maven repo declared in settings.gradle. Everything the SDK needs, video
    // engine included, comes with it via the published POM.
    implementation "com.onevalet:onevaletsdk:0.0.3"

    implementation "androidx.core:core-ktx:$core_version"
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation "androidx.activity:activity-compose:$activity_compose_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"
    // App-wide foreground detection: the demo's event stream is open exactly while
    // the app is visible (see CallEventCoordinator).
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    // Networking: JSON (de)serialization for the sample's networking layer.
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinx_serialization_version"

    def composeBom = platform("androidx.compose:compose-bom:$compose_bom_version")
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugar_jdk_libs_version"
}
