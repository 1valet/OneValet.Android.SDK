pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Where `com.onevalet:onevaletsdk` resolves from — a plain directory-layout
        // Maven repo over anonymous HTTPS, no credentials. This is the line an
        // integrator adds; see README "Installation".
        maven { url "https://raw.githubusercontent.com/1valet/OneValetSDK-Android/maven" }
    }
}

rootProject.name = 'OneValetSDK.Android-Samples'

include ':demo'
